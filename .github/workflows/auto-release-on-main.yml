name: Auto release on main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create next release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      created: ${{ steps.bump.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Compute next patch tag
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Find latest stable vMAJOR.MINOR.PATCH tag reachable from default branch
          latest="$(git tag -l 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$latest" ]; then
            base="0.0.0"
          else
            base="${latest#v}"
          fi

          IFS='.' read -r major minor patch <<<"$base"
          next_patch=$((patch + 1))
          next_version="${major}.${minor}.${next_patch}"
          next_tag="v${next_version}"

          # Avoid duplicate tag races
          if git rev-parse -q --verify "refs/tags/${next_tag}" >/dev/null; then
            echo "Tag ${next_tag} already exists; skipping creation."
            echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"
            echo "version=${next_version}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "${next_tag}" -m "Release ${next_tag}"
          git push origin "refs/tags/${next_tag}"

          echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${next_version}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Auto release tag" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ steps.bump.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${{ steps.bump.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- created: \`${{ steps.bump.outputs.created }}\`" >> "$GITHUB_STEP_SUMMARY"
