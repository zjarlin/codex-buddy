name: Probe macOS runner
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  probe14:
    name: Probe macos-14
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m
  probe15:
    name: Probe macos-15
